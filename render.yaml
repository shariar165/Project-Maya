services:
  - type: web
    name: maya-backend
    runtime: python
    buildCommand: pip install -r maya-backend/requirements.txt
    startCommand: cd maya-backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TARA_VOICE_ID
        value: 9BWtsMINqrJLrRacOk9x
      - key: MCP_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./maya.db
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "False"
